<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="card">

    <h2>🌤 Weather App</h2>

    <div class="search">
      <select id="city">
        <option value="">Select City</option>
        <option value="new york">New York</option>
        <option value="london">London</option>
        <option value="paris">Paris</option>
        <option value="tokyo">Tokyo</option>
        <option value="delhi">Delhi</option>
      </select>

      <button onclick="getWeather()">Search</button>
    </div>

    <div id="weather" class="hidden">
      <img id="icon" />

      <h1 id="temp">--°C</h1>
      <p id="condition">---</p>

      <div class="details">
        <div>
          <span>💧</span>
          <p id="humidity">--%</p>
          <small>Humidity</small>
        </div>

        <div>
          <span>🌬</span>
          <p id="wind">-- km/h</p>
          <small>Wind</small>
        </div>

        <div>
          <span>🌡</span>
          <p id="feels">--°C</p>
          <small>Feels Like</small>
        </div>
      </div>

      <p class="location" id="location"></p>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
