<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h1>🌤 Weather App</h1>

  <select id="city-select">
    <option value=""></option>
    <option value="new york">New York</option>
    <option value="los angeles">Los Angeles</option>
    <option value="chicago">Chicago</option>
    <option value="paris">Paris</option>
    <option value="tokyo">Tokyo</option>
    <option value="london">London</option>
  </select>

  <button id="get-weather-btn">Get Weather</button>

  <div id="weather-container">
    <img id="weather-icon" />

    <p><strong>Temperature:</strong> <span id="main-temperature"></span></p>
    <p><strong>Feels Like:</strong> <span id="feels-like"></span></p>
    <p><strong>Humidity:</strong> <span id="humidity"></span></p>
    <p><strong>Wind Speed:</strong> <span id="wind"></span></p>
    <p><strong>Wind Gust:</strong> <span id="wind-gust"></span></p>
    <p><strong>Condition:</strong> <span id="weather-main"></span></p>
    <p><strong>Location:</strong> <span id="location"></span></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
